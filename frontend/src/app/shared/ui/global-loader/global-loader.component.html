<!-- TOP BAR: toujours prête, visible quand active -->
<div
  *ngIf="state$ | async as s"
  class="fixed left-0 right-0 top-0 z-[100] pointer-events-none"
>
  <div
    *ngIf="s.active"
    class="h-[3px] w-full overflow-hidden bg-transparent"
    aria-hidden="true"
  >
    <div
      class="h-full w-[40%] animate-[stBar_1.1s_ease-in-out_infinite] bg-gradient-to-r from-indigo-500 via-purple-500 to-fuchsia-500"
    ></div>
  </div>
</div>

<!-- OVERLAY: seulement quand mode === 'overlay' -->
<div
  *ngIf="state$ | async as s"
  class="fixed inset-0 z-[110]"
  [class.hidden]="!(s.active && s.mode === 'overlay')"
  aria-live="polite"
  aria-busy="true"
>
  <!-- Backdrop léger (moins agressif) -->
  <div class="absolute inset-0 bg-black/20 backdrop-blur-[2px]"></div>

  <!-- Card -->
  <div class="relative h-full w-full flex items-center justify-center p-4">
    <div
      class="w-full max-w-md rounded-2xl border shadow-xl overflow-hidden bg-white/90 border-slate-200 dark:bg-slate-950/80 dark:border-slate-800"
    >
      <!-- Gradient line -->
      <div
        class="h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-fuchsia-500"
      ></div>

      <div class="p-5">
        <div class="flex items-center gap-3">
          <!-- Spinner -->
          <div
            class="h-9 w-9 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center"
          >
            <div
              class="h-4 w-4 rounded-full border-2 border-slate-300 dark:border-slate-700 border-t-indigo-500 dark:border-t-indigo-400 animate-spin"
            ></div>
          </div>

          <div class="flex-1 min-w-0">
            <div
              class="text-sm font-semibold text-slate-900 dark:text-slate-100"
            >
              {{ s.message || "Chargement..." }}
            </div>
            <div class="text-xs text-slate-500 dark:text-slate-400">
              Synchronisation des données SmartTask
            </div>
          </div>

          <!-- Dots -->
          <div class="flex items-center gap-1">
            <span
              class="h-1.5 w-1.5 rounded-full bg-slate-400/70 dark:bg-slate-500/70 animate-[stDot_1s_0ms_infinite]"
            ></span>
            <span
              class="h-1.5 w-1.5 rounded-full bg-slate-400/70 dark:bg-slate-500/70 animate-[stDot_1s_150ms_infinite]"
            ></span>
            <span
              class="h-1.5 w-1.5 rounded-full bg-slate-400/70 dark:bg-slate-500/70 animate-[stDot_1s_300ms_infinite]"
            ></span>
          </div>
        </div>

        <!-- Mini skeleton -->
        <div class="mt-4 space-y-2">
          <div
            class="h-3 w-3/4 rounded bg-slate-200/70 dark:bg-slate-800/70 animate-pulse"
          ></div>
          <div
            class="h-3 w-2/3 rounded bg-slate-200/70 dark:bg-slate-800/70 animate-pulse"
          ></div>
          <div
            class="h-3 w-1/2 rounded bg-slate-200/70 dark:bg-slate-800/70 animate-pulse"
          ></div>
        </div>
      </div>
    </div>
  </div>
</div>
