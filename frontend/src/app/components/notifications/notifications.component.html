<div class="space-y-6 transition-colors duration-300">
  <!-- Header -->
  <section
    class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between st-enter"
  >
    <div class="space-y-1">
      <h1 class="text-2xl font-semibold text-slate-900 dark:text-slate-100">
        Notifications
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Suivez les mises à jour des projets et tâches SmartTask.
      </p>
    </div>

    <div class="flex items-center gap-2">
      <span
        class="inline-flex items-center gap-2 text-xs px-3 py-1 rounded-full border border-purple-200 bg-purple-50 text-purple-700 dark:border-purple-500/25 dark:bg-purple-500/10 dark:text-purple-200"
      >
        <lucide-icon name="BellRing" class="w-4 h-4"></lucide-icon>
        {{ unreadCount }} non lues
      </span>

      <ui-button
        variant="primary"
        (click)="markAllRead()"
        [disabled]="!unreadCount || markingAll"
      >
        <span class="inline-flex items-center gap-2">
          <lucide-icon name="CheckCheck" class="w-4 h-4"></lucide-icon>
          {{ markingAll ? "..." : "Tout marquer lu" }}
        </span>
      </ui-button>
    </div>
  </section>

  <!-- Error -->
  <ui-card
    *ngIf="error"
    padding="md"
    variant="soft"
    className="border-red-100 bg-red-50 dark:border-red-900/40 dark:bg-red-950/30 st-enter"
  >
    <div class="flex items-center justify-between gap-3">
      <p class="text-sm text-red-700 dark:text-red-200">{{ error }}</p>
      <div class="flex items-center gap-2">
        <ui-button variant="secondary" (click)="reload()">Réessayer</ui-button>
        <ui-button variant="secondary" (click)="clearError()">OK</ui-button>
      </div>
    </div>
  </ui-card>

  <!-- Controls -->
  <ui-card padding="md" variant="default" className="st-enter">
    <div
      class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between"
    >
      <div class="flex-1 relative">
        <span
          class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"
        >
          <lucide-icon name="Search" class="w-4 h-4"></lucide-icon>
        </span>
        <input
          type="text"
          [value]="searchTerm"
          (input)="onSearch($any($event.target).value)"
          placeholder="Rechercher dans les notifications..."
          class="w-full pl-10 pr-3 py-2.5 rounded-2xl border text-sm transition-colors border-slate-200 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-purple-100 focus:border-purple-400 dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:focus:ring-purple-500/25 dark:focus:border-purple-400"
        />
      </div>

      <div class="flex items-center gap-2">
        <span
          class="inline-flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400"
        >
          <lucide-icon name="Filter" class="w-4 h-4"></lucide-icon>
          Filtre
        </span>

        <button
          type="button"
          (click)="setMode('unread')"
          class="text-xs px-3 py-2 rounded-xl border transition-colors"
          [ngClass]="
            mode === 'unread'
              ? 'border-purple-300 bg-purple-50 text-purple-700 dark:border-purple-500/25 dark:bg-purple-500/10 dark:text-purple-200'
              : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/40 dark:text-slate-200 dark:hover:bg-slate-900/40'
          "
        >
          Non lues
        </button>

        <button
          type="button"
          (click)="setMode('all')"
          class="text-xs px-3 py-2 rounded-xl border transition-colors"
          [ngClass]="
            mode === 'all'
              ? 'border-purple-300 bg-purple-50 text-purple-700 dark:border-purple-500/25 dark:bg-purple-500/10 dark:text-purple-200'
              : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/40 dark:text-slate-200 dark:hover:bg-slate-900/40'
          "
        >
          Toutes
        </button>
      </div>
    </div>
  </ui-card>

  <!-- Loading skeleton -->
  <section *ngIf="loading" class="space-y-3 st-enter">
    <ui-card
      *ngFor="let _ of [1, 2, 3, 4]"
      padding="md"
      variant="default"
      className="animate-pulse"
    >
      <div class="flex items-start justify-between gap-4">
        <div class="flex items-start gap-3">
          <div
            class="w-10 h-10 rounded-2xl bg-slate-100 dark:bg-slate-800"
          ></div>
          <div class="space-y-2">
            <div class="h-4 w-52 rounded bg-slate-100 dark:bg-slate-800"></div>
            <div class="h-3 w-72 rounded bg-slate-100 dark:bg-slate-800"></div>
          </div>
        </div>
        <div class="h-3 w-16 rounded bg-slate-100 dark:bg-slate-800"></div>
      </div>
    </ui-card>
  </section>

  <!-- List -->
  <section *ngIf="!loading" class="space-y-3 st-enter">
    <button
      *ngFor="let n of filtered; let i = index"
      type="button"
      (click)="openNotification(n)"
      [class]="rowClass(n)"
      [style.animationDelay.ms]="60 + i * 35"
    >
      <div class="flex items-start justify-between gap-4">
        <div class="flex items-start gap-3 min-w-0">
          <div
            class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 bg-gradient-to-br from-purple-600 to-violet-600 text-white shadow-sm"
          >
            <lucide-icon [name]="iconName(n)" class="w-5 h-5"></lucide-icon>
          </div>

          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <div
                class="text-sm font-semibold text-slate-900 dark:text-slate-100 truncate"
              >
                {{ n.title }}
              </div>

              <span
                class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium"
                [ngClass]="pillClass(n)"
              >
                {{ n.level }}
              </span>

              <span
                *ngIf="!n.readAt"
                class="inline-flex items-center gap-1 text-[11px] text-purple-700 dark:text-purple-200"
              >
                <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                Nouveau
              </span>
            </div>

            <div
              class="mt-1 text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap"
            >
              {{ n.body }}
            </div>

            <div class="mt-2 text-[11px] text-slate-400 dark:text-slate-500">
              {{ n.createdAt | date : "dd MMM, HH:mm" }}
              <span *ngIf="n.projectId" class="ml-2 font-mono opacity-80"
                >proj: {{ n.projectId.slice(0, 6) }}</span
              >
              <span *ngIf="n.taskId" class="ml-2 font-mono opacity-80"
                >task: {{ n.taskId.slice(0, 6) }}</span
              >
            </div>
          </div>
        </div>

        <div class="shrink-0 flex items-center gap-2">
          <button
            *ngIf="!n.readAt"
            type="button"
            (click)="markRead(n, $event)"
            class="p-2 rounded-xl border transition-colors border-slate-200 bg-white hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/40 dark:hover:bg-slate-900/40"
            title="Marquer comme lu"
          >
            <lucide-icon
              name="Check"
              class="w-4 h-4 text-slate-600 dark:text-slate-200"
            ></lucide-icon>
          </button>
        </div>
      </div>
    </button>

    <ui-card
      *ngIf="filtered.length === 0"
      padding="md"
      variant="soft"
      className="st-enter"
    >
      <div class="text-center py-8">
        <div
          class="inline-flex flex-col items-center gap-2 text-slate-500 dark:text-slate-400"
        >
          <lucide-icon name="Bell" class="w-6 h-6"></lucide-icon>
          <div class="text-sm font-medium">Aucune notification</div>
          <div class="text-xs">Tout est à jour.</div>
        </div>
      </div>
    </ui-card>
  </section>
</div>

<!-- Petite animation d'entrée (optionnel) -->
<style>
  .st-enter {
    animation: stFadeUp 0.35s ease-out both;
  }
  @keyframes stFadeUp {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
