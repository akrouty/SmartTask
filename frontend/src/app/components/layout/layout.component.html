<div
  class="relative h-screen flex bg-slate-50 text-slate-900 overflow-hidden dark:bg-slate-950 dark:text-slate-100"
>
  <div class="absolute inset-0 -z-0 pointer-events-none">
    <!-- Base -->
    <div class="absolute inset-0 bg-slate-50 dark:bg-slate-950"></div>
    <div
      class="absolute -bottom-28 -right-28 h-[720px] w-[1820px] rounded-full blur-xl opacity-50 bg-gradient-to-br from-fuchsia-500/55 via-purple-500/40 to-indigo-900/60 dark:opacity-60 st-blob-water"
    ></div>

    <!-- Soft blobs -->
  </div>
  <!-- SIDEBAR -->
  <aside
    class="relative z-10 w-64 border-r border-purple-400 flex flex-col h-full backdrop-blur-xl dark:bg-slate-950/55 dark:border-slate-800"
  >
    <!-- Logo / titre -->
    <div
      class="relative z-10 px-6 py-3 flex items-center gap-3 border-b border-slate-100 dark:border-slate-800"
    >
      <img
        src="/assets/logo_f.png"
        alt="SmartTask"
        class="h-10 w-20 rounded-2xl shadow-md object-contain bg-white dark:bg-slate-900"
      />
      <div>
        <div class="font-semibold text-slate-900 dark:text-slate-100">
          SmartTask
        </div>
        <div class="text-xs text-slate-400 dark:text-slate-400">
          Gestion simplifiée
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
      <!-- Tableau de bord -->
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50 hover:text-indigo-600 dark:hover:text-indigo-300 transition"
      >
        <div
          class="h-9 w-9 rounded-2xl flex items-center justify-center bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/10 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition"
        >
          <lucide-icon [img]="icons.dashboard" class="w-5 h-5"></lucide-icon>
        </div>
        <span class="text-[0.92rem] font-medium">Tableau de bord</span>
      </a>

      <!-- Projets -->
      <a
        routerLink="/projects"
        routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50 hover:text-indigo-600 dark:hover:text-indigo-300 transition"
      >
        <div
          class="h-9 w-9 rounded-2xl flex items-center justify-center bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/10 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition"
        >
          <lucide-icon [img]="icons.projects" class="w-5 h-5"></lucide-icon>
        </div>
        <span class="text-[0.92rem] font-medium">Projets</span>
      </a>

      <!-- Tâches -->
      <a
        routerLink="/tasks"
        routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50 hover:text-indigo-600 dark:hover:text-indigo-300 transition"
      >
        <div
          class="h-9 w-9 rounded-2xl flex items-center justify-center bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/10 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition"
        >
          <lucide-icon [img]="icons.tasks" class="w-5 h-5"></lucide-icon>
        </div>

        <span class="text-[0.92rem] font-medium">Tâches</span>
      </a>

      <!-- Messages -->
      <a
        routerLink="/messages"
        routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50 hover:text-indigo-600 dark:hover:text-indigo-300 transition"
      >
        <div
          class="h-9 w-9 rounded-2xl flex items-center justify-center bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/10 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition"
        >
          <lucide-icon [img]="icons.messages" class="w-5 h-5"></lucide-icon>
        </div>
        <span class="text-[0.92rem] font-medium">Messages</span>
      </a>

      <!-- Statistiques -->
      <a
        routerLink="/stats"
        routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50 hover:text-indigo-600 dark:hover:text-indigo-300 transition"
      >
        <div
          class="h-9 w-9 rounded-2xl flex items-center justify-center bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/10 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition"
        >
          <lucide-icon [img]="icons.stats" class="w-5 h-5"></lucide-icon>
        </div>
        <span class="text-[0.92rem] font-medium">Statistiques</span>
      </a>

      <!-- Profil -->
      <a
        routerLink="/profile"
        routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50 hover:text-indigo-600 dark:hover:text-indigo-300 transition"
      >
        <div
          class="h-9 w-9 rounded-2xl flex items-center justify-center bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/10 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition"
        >
          <lucide-icon [img]="icons.profile" class="w-5 h-5"></lucide-icon>
        </div>
        <span class="text-[0.92rem] font-medium">Profil</span>
      </a>

      <!-- Notifications -->
      <a
        routerLink="/notifications"
        routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50 hover:text-indigo-600 dark:hover:text-indigo-300 transition"
      >
        <div
          class="h-9 w-9 rounded-2xl flex items-center justify-center bg-slate-50 dark:bg-slate-900/60 text-slate-400 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/10 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition"
        >
          <lucide-icon
            [img]="icons.notifications"
            class="w-5 h-5"
          ></lucide-icon>
        </div>
        <span class="text-[0.92rem] font-medium">Notifications</span>
        <span *ngIf="unreadCount$ | async as c" class="ml-auto">
          <span
            *ngIf="c > 0"
            class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-2 rounded-full text-[11px] font-semibold bg-purple-600 text-white shadow-sm"
          >
            {{ c }}
          </span>
        </span>
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex flex-col h-full">
    <!-- Top bar -->
    <header
      class="h-16 z-30 px-8 border-b border-transparent bg-transparent flex items-center justify-between shrink-0 dark:bg- dark:border-slate-800"
    >
      <div></div>

      <div class="flex items-center gap-4">
        <div class="text-right text-xs">
          <div
            class="font-medium text-slate-800 dark:text-slate-100"
            *ngIf="auth.currentUser$ | async as user"
          >
            {{ user.fullName }}
          </div>
          <div class="text-slate-400 dark:text-slate-400">Connecté</div>
        </div>

        <button
          (click)="logout()"
          class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/50"
        >
          Déconnexion
        </button>

        <button
          type="button"
          class="px-3 py-2 rounded-xl border dark:border-slate-900 bg-white dark:bg-slate-950 text-slate-700 border-slate-800 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-900/50 transition-colors"
          (click)="theme.toggle()"
        >
          <lucide-icon
            [img]="theme.isDark() ? sun : moon"
            class="w-5 h-5 transition-transform duration-200"
            [class.rotate-180]="theme.isDark()"
          ></lucide-icon>
        </button>
        <div
          class="relative"
          (mouseenter)="openDropdown()"
          (mouseleave)="scheduleClose()"
        >
          <button
            (click)="toggleDropdown()"
            type="button"
            class="relative w-10 h-10 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950/40 dark:hover:bg-slate-900/40"
          >
            <lucide-icon name="Bell" class="w-5 h-5 mx-auto"></lucide-icon>

            <span *ngIf="unreadCount$ | async as c">
              <span
                *ngIf="c > 0"
                class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-bold bg-purple-600 text-white flex items-center justify-center"
              >
                {{ c > 99 ? "99+" : c }}
              </span>
            </span>
          </button>

          <!-- hover dropdown -->
          <div
            *ngIf="open"
            class="absolute right-0 mt-2 w-[360px] rounded-2xl border border-slate-200 bg-white shadow-lg overflow-hidden dark:border-slate-800 dark:bg-slate-950/90"
          >
            <div
              class="px-0 py-0 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between"
            >
              <div class="text-sm font-semibold">Dernières notifications</div>
              <a
                routerLink="/notifications"
                class="text-xs text-purple-600 hover:underline"
                >Voir tout</a
              >
            </div>

            <div class="max-h-[320px] overflow-auto">
              <ng-container *ngIf="latest$ | async as list">
                <div
                  *ngFor="let n of list | slice : 0 : 5"
                  class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-900/40"
                >
                  <div class="flex items-start gap-3">
                    <span
                      class="mt-1 w-2 h-2 rounded-full"
                      [ngClass]="n.readAt ? 'bg-slate-300' : 'bg-purple-600'"
                    ></span>

                    <div class="min-w-0">
                      <div
                        class="text-sm font-medium text-slate-900 dark:text-slate-100"
                      >
                        {{ n.title }}
                      </div>
                      <div
                        class="text-xs text-slate-500 dark:text-slate-400 truncate"
                      >
                        {{ n.body }}
                      </div>
                    </div>
                  </div>
                </div>

                <div
                  *ngIf="list.length === 0"
                  class="px-4 py-8 text-center text-sm text-slate-500"
                >
                  Aucune notification.
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Zone de contenu des pages -->
    <main class="flex-1 p-8 overflow-auto bg-transparent dark:bg-slate-950/35">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
